services:
  server:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      QDRANT_URL: ${QDRANT_URL}
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  qdrant_data:
