# ======================================================
# ==================[ DOCKER COMPOSE ]==================
# ======================================================

services:
  # ======================================================
  # ======================[ SERVER ]======================
  # ======================================================

  server:
    build:
      context: .
      args:
        PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      DOCLING_MERGE_PEERS: ${DOCLING_MERGE_PEERS}
      DOCLING_MAX_CHUNK_TOKENS: ${DOCLING_MAX_CHUNK_TOKENS}
      DOCLING_ALWAYS_EMIT_HEADINGS: ${DOCLING_ALWAYS_EMIT_HEADINGS}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_USE_FP16: ${EMBEDDING_USE_FP16}
      EMBEDDING_DENSE_KEY: ${EMBEDDING_DENSE_KEY}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      EMBEDDING_RETURN_DENSE: ${EMBEDDING_RETURN_DENSE}
      EMBEDDING_RETURN_SPARSE: ${EMBEDDING_RETURN_SPARSE}
      EMBEDDING_RETURN_COLBERT_VECS: ${EMBEDDING_RETURN_COLBERT_VECS}

      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS}

      QDRANT_URL: ${QDRANT_URL}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      QDRANT_WRITE_WAIT: ${QDRANT_WRITE_WAIT}
      QDRANT_CLIENT_TIMEOUT: ${QDRANT_CLIENT_TIMEOUT}
      QDRANT_HEALTHCHECK_RETRIES: ${QDRANT_HEALTHCHECK_RETRIES}
      QDRANT_HEALTHCHECK_TIMEOUT: ${QDRANT_HEALTHCHECK_TIMEOUT}
      QDRANT_HEALTHCHECK_INTERVAL: ${QDRANT_HEALTHCHECK_INTERVAL}
      QDRANT_HEALTHCHECK_START_PERIOD: ${QDRANT_HEALTHCHECK_START_PERIOD}
    depends_on:
      qdrant:
        condition: service_healthy

  # ======================================================
  # ======================[ QDRANT ]======================
  # ======================================================

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      retries: ${QDRANT_HEALTHCHECK_RETRIES}
      timeout: ${QDRANT_HEALTHCHECK_TIMEOUT}s
      interval: ${QDRANT_HEALTHCHECK_INTERVAL}s
      start_period: ${QDRANT_HEALTHCHECK_START_PERIOD}s

volumes:
  qdrant_storage:
