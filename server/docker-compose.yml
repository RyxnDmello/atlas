# ======================================================
# ==================[ DOCKER COMPOSE ]==================
# ======================================================

services:
  # ======================================================
  # ======================[ SERVER ]======================
  # ======================================================

  server:
    build:
      context: .
      args:
        PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_HEALTHCHECK_RETRIES: ${QDRANT_HEALTHCHECK_RETRIES}
      QDRANT_HEALTHCHECK_TIMEOUT: ${QDRANT_HEALTHCHECK_TIMEOUT}
      QDRANT_HEALTHCHECK_INTERVAL: ${QDRANT_HEALTHCHECK_INTERVAL}
      QDRANT_HEALTHCHECK_START_PERIOD: ${QDRANT_HEALTHCHECK_START_PERIOD}
    depends_on:
      qdrant:
        condition: service_healthy

  # ======================================================
  # ======================[ QDRANT ]======================
  # ======================================================

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      retries: ${QDRANT_HEALTHCHECK_RETRIES}
      timeout: ${QDRANT_HEALTHCHECK_TIMEOUT}s
      interval: ${QDRANT_HEALTHCHECK_INTERVAL}s
      start_period: ${QDRANT_HEALTHCHECK_START_PERIOD}s

volumes:
  qdrant_storage:
