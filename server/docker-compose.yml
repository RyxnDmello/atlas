# ======================================================
# ==================[ DOCKER COMPOSE ]==================
# ======================================================

services:
  # ======================================================
  # ======================[ SERVER ]======================
  # ======================================================

  server:
    build:
      context: .
      args:
        PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      CORS_ORIGINS: ${CORS_ORIGINS}

      DOCLING_MERGE_PEERS: ${DOCLING_MERGE_PEERS}
      DOCLING_MAX_CHUNK_TOKENS: ${DOCLING_MAX_CHUNK_TOKENS}
      DOCLING_ALWAYS_EMIT_HEADINGS: ${DOCLING_ALWAYS_EMIT_HEADINGS}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_USE_FP16: ${EMBEDDING_USE_FP16}
      EMBEDDING_DENSE_KEY: ${EMBEDDING_DENSE_KEY}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION}
      EMBEDDING_RETURN_DENSE: ${EMBEDDING_RETURN_DENSE}
      EMBEDDING_RETURN_SPARSE: ${EMBEDDING_RETURN_SPARSE}
      EMBEDDING_RETURN_COLBERT_VECS: ${EMBEDDING_RETURN_COLBERT_VECS}

      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS}

      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      QDRANT_WRITE_WAIT: ${QDRANT_WRITE_WAIT}
      QDRANT_CLIENT_TIMEOUT: ${QDRANT_CLIENT_TIMEOUT}

      POSTGRES_PORT: 5432
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB NOT PROVIDED}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER NOT PROVIDED}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD NOT PROVIDED}

      AUTH_OTP_TTL_SECONDS: ${AUTH_OTP_TTL_SECONDS:-600}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE NOT PROVIDED}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?AUTH_ACCESS_TOKEN_SECRET NOT PROVIDED}
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ======================================================
  # ======================[ QDRANT ]======================
  # ======================================================

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      retries: ${QDRANT_HEALTHCHECK_RETRIES:-20}
      timeout: ${QDRANT_HEALTHCHECK_TIMEOUT:-3}s
      interval: ${QDRANT_HEALTHCHECK_INTERVAL:-5}s
      start_period: ${QDRANT_HEALTHCHECK_START_PERIOD:-5}s

  # ======================================================
  # =====================[ POSTGRES ]=====================
  # ======================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    command: ["postgres", "-p", "5432"]
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB NOT PROVIDED}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER NOT PROVIDED}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD NOT PROVIDED}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_storage:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h "127.0.0.1" -p "5432" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3}s
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-5}s
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-5}s

volumes:
  qdrant_storage:
  postgres_storage:
